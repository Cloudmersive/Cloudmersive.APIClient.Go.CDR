        type: "file"
        x-exportParamName: "InputFile"
      responses:
        "200":
          description: "OK"
          schema:
            type: "string"
            format: "binary"
        "400":
          description: "Bad Request"
          schema:
            $ref: "#/definitions/ProblemDetails"
        "401":
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/ProblemDetails"
  /cdr/sanitization/file/to/pdf/advanced:
    post:
      tags:
      - "FileSanitization"
      summary: "Advanced Content Disarm and Reconstruction on a File with PDFA Output"
      description: "Processes the input file via CDR to produce a secured PDF/A output\
