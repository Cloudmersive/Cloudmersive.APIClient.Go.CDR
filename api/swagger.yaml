securityDefinitions:
  Apikey:
    description: "API Key Authentication"
    type: "apiKey"
    name: "Apikey"
    in: "header"
definitions:
  ProblemDetails:
    type: "object"
    properties:
      type:
        type: "string"
      title:
        type: "string"
      status:
        type: "integer"
        format: "int32"
      detail:
        type: "string"
      instance:
        type: "string"
    additionalProperties: {}
