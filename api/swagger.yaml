        required: false
        type: "boolean"
        x-exportParamName: "AllowExecutables"
        x-optionalDataType: "Bool"
      - name: "allowInvalidFiles"
        in: "header"
        description: "Set to false to block files that are not valid for their detected\
          \ type"
        required: false
        type: "boolean"
        x-exportParamName: "AllowInvalidFiles"
        x-optionalDataType: "Bool"
      - name: "allowScripts"
        in: "header"
        description: "Set to false to block script files. PDF and Office macro sanitization\
          \ still runs regardless."
        required: false
        type: "boolean"
        x-exportParamName: "AllowScripts"
        x-optionalDataType: "Bool"
      - name: "allowPasswordProtectedFiles"
        in: "header"
        description: "Set to false to block password-protected files"
        required: false
        type: "boolean"
        x-exportParamName: "AllowPasswordProtectedFiles"
        x-optionalDataType: "Bool"
      - name: "allowMacros"
        in: "header"
        description: "Set to false to block files containing macros. Office macro\
          \ removal still runs regardless."
        required: false
        type: "boolean"
        x-exportParamName: "AllowMacros"
        x-optionalDataType: "Bool"
      - name: "allowXmlExternalEntities"
        in: "header"
        description: "Set to false to block XML files with external entity references\
          \ (XXE)"
        required: false
        type: "boolean"
        x-exportParamName: "AllowXmlExternalEntities"
        x-optionalDataType: "Bool"
      - name: "allowInsecureDeserialization"
        in: "header"
        description: "Set to false to block files with insecure deserialization patterns"
        required: false
        type: "boolean"
        x-exportParamName: "AllowInsecureDeserialization"
        x-optionalDataType: "Bool"
      - name: "allowHtml"
        in: "header"
        description: "Set to false to block HTML files"
        required: false
